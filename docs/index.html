    <!-- Safe GitHub Pages fallback detector for uncompiled main-branch deployments -->
    <script>
      (function() {
        var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;

        // If served statically from GitHub Pages root where uncompiled src/main.tsx cannot be run by browser
        if (isGitHubPages && isNotDocs) {
          window.__ghp_redirect_timer = setTimeout(function() {
            var rootEl = document.getElementById('root');
            // If React has not mounted (no main content yet)
            if (rootEl && !rootEl.querySelector('nav')) {
              var basePath = window.location.pathname.replace(/\/+$/, '');
              window.location.replace(basePath + '/docs/' + window.location.search + window.location.hash);
            }
          }, 500);
        }
      })();
